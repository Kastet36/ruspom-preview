.options-header{max-width:1740px;margin:0 auto;padding:40px clamp(20px,4.4vw,80px) 30px}.options-header>a{font-size:13px;color:var(--muted)}.options-header h1{font-size:clamp(28px,3vw,44px);letter-spacing:-.04em;margin:26px 0 14px}.options-header p{max-width:740px;color:var(--muted);font-size:15px;line-height:1.7;margin:0}.options-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1900px;padding:0 28px 64px;margin:auto}.option-card{min-width:0}.option-link{display:block;border:1px solid #c4a56550;border-radius:5px;overflow:hidden}.option-link:hover{border-color:var(--gold)}.option-link:focus-visible{outline:2px solid var(--gold);outline-offset:5px}.preview-frame{position:relative;aspect-ratio:1440/720;overflow:hidden;pointer-events:none}.preview-frame iframe{position:absolute;left:0;top:0;width:1440px;height:720px;border:0;transform-origin:top left;pointer-events:none}.option-caption{padding:20px;border-top:1px solid #ffffff14;display:flex;justify-content:space-between;gap:15px;align-items:center}.option-caption strong{font-size:17px;line-height:1.4}.option-caption span{font-size:23px;color:var(--gold)}.option-description{margin:14px 2px 0;color:var(--muted);font-size:14px;line-height:1.7}.option-description b{font-weight:600;color:var(--cream)}

.concept{position:relative}.concept h2{margin-bottom:32px}.proposal{display:grid;column-gap:64px;align-items:center}.proposal .concept-button{width:100%;min-width:0;max-width:none;margin-top:24px}.proposal-action{min-width:0}.proposal-action .concept-help{max-width:360px;font-size:19px;line-height:1.65}.proposal-action .concept-note{font-size:10px;max-width:none}.proposal-rate{min-width:0}.proposal-facts{min-width:0}.concept-facts br{display:none}.variant-nav{align-items:center}.grid-toggle{font:inherit;color:var(--muted);border:1px solid #ffffff30;background:transparent;padding:8px 12px;border-radius:4px}.grid-toggle[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}.grid-guide{display:none;position:absolute;inset:15px clamp(25px,4.4vw,80px);border-left:1px dashed #e7b76680;border-right:1px dashed #e7b76680;pointer-events:none;z-index:3}.grid-guide:after{content:"";position:absolute;right:400px;top:0;bottom:0;border-left:1px dashed #e7b76680}.show-grid .grid-guide{display:block}
.layout-one{grid-template-columns:minmax(0,1fr) 400px;border-top:1px solid #c4a56560;padding-top:32px}.layout-one .proposal-rate .concept-facts{flex-direction:row;gap:32px;margin-top:30px}.layout-one .proposal-rate .concept-facts p{font-size:15px;max-width:240px}.layout-one .proposal-rate .concept-facts svg{width:21px;height:21px}.layout-one .concept-rate strong{font-size:140px}
.layout-two{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 400px;gap:40px;border-top:1px solid #c4a56560;border-bottom:1px solid #c4a56560;padding:30px 0}.layout-two .concept-rate strong{font-size:116px}.layout-two .concept-rate{gap:11px;flex-wrap:wrap;row-gap:8px}.layout-two .concept-rate>span:last-child{flex-basis:100%}.layout-two .concept-facts p{font-size:16px}.layout-two .proposal-action .concept-help{font-size:16px}.layout-two .proposal-action .concept-button{margin-top:20px}
.layout-three{grid-template-columns:minmax(0,1fr) 400px;align-items:center}.layout-three .concept-rate strong{font-size:180px}.layout-three .concept-rate>span:first-child{font-size:32px}.layout-three .concept-facts{gap:18px;margin-bottom:24px}.layout-three .concept-facts p{font-size:17px}.layout-three .proposal-action .concept-help{font-size:16px}.layout-three .proposal-action .concept-button{margin-top:22px}
.standalone .concept{padding-top:44px}.embedded .variant-nav{display:none}.embedded .context-next{padding-top:24px}.embedded .concept{padding-top:48px;padding-bottom:36px}.embedded .concept h2{font-size:46px}.embedded .context-next h2{font-size:30px}
@media(max-width:1100px){.options-grid{grid-template-columns:1fr;max-width:940px;padding:0 20px 40px;gap:34px}.proposal{column-gap:32px}.layout-one,.layout-three{grid-template-columns:minmax(0,1fr) 320px}.layout-two{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 300px;gap:24px}.layout-two .concept-rate strong{font-size:96px}.layout-three .concept-rate strong{font-size:148px}.layout-one .proposal-rate .concept-facts{flex-direction:column;gap:18px}.grid-guide:after{right:320px}.concept:has(.layout-two) .grid-guide:after{right:300px}.layout-two .concept-facts p{font-size:14px}.layout-two .proposal-action .concept-button{padding:18px 20px}.layout-two .proposal-action .concept-help{font-size:15px}}
@media(max-width:780px){.concept{padding:32px 20px}.concept h2{margin-bottom:28px}.proposal{grid-template-columns:1fr;gap:26px}.layout-one{padding-top:24px}.concept-rate{gap:11px}.concept-rate>span:first-child,.layout-three .concept-rate>span:first-child{font-size:22px}.concept-rate>span:last-child{font-size:12px}.layout-one .concept-rate strong,.layout-two .concept-rate strong,.layout-three .concept-rate strong{font-size:100px}.layout-one .proposal-rate .concept-facts{margin-top:24px;gap:18px}.concept-facts p,.layout-two .concept-facts p,.layout-three .concept-facts p{font-size:15px}.proposal-action .concept-help{font-size:16px}.proposal .concept-button{max-width:none}.proposal .concept-note{font-size:10px}.layout-two{padding:24px 0}.layout-two .concept-rate{flex-wrap:nowrap}.layout-two .concept-rate>span:last-child{flex-basis:auto}.layout-three .concept-facts{margin-bottom:24px}.context-next{padding:25px 20px}.context-next h2{font-size:28px}.variant-nav{font-size:12px;flex-wrap:wrap}.variant-nav>span{display:none}.option-caption strong{font-size:16px}.options-header{padding-top:28px}.grid-guide{left:20px;right:20px}.grid-guide:after{display:none}}
</style>
</head><body>
<script>
const variants=[{id:'01',name:'Ставка и действие',description:'Ставка и преимущества собраны слева. Справа пояснение и кнопка на всю ширину колонки. Правый край кнопки совпадает с краем контейнера сайта.'},{id:'02',name:'Компактная полоса',description:'Три короткие группы в одной строке: ставка, преимущества, действие. Кнопка справа привязана к общей внешней вертикали.'},{id:'03',name:'Крупная ставка',description:'Крупная ставка слева. Справа преимущества, помощь и кнопка выстроены по одной вертикали. Общий правый край сохранён.'}];
const rate='<p class="concept-rate" aria-label="От 6 процентов годовых"><span>от</span><strong>6<span>%</span></strong><span>годовых</span></p>';
const shield='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></svg>';
const bank='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m3 8 9-5 9 5v2H3V8ZM5 10v9m7-9v9m7-9v9M3 21h18"/></svg>';
const facts='<div class="concept-facts"><p>'+shield+'<span>Строительство через <br>эскроу-счёт</span></p><p>'+bank+'<span>Аккредитация <br>в 5 банках</span></p></div>';
const help='<p class="concept-help">Поможем подобрать программу и подготовить документы.</p>';
const action='<a class="cta concept-button" href="tel:+78124256667">Узнать условия <span class="arrow" aria-hidden="true">→</span></a><p class="concept-note">Условия и одобрение зависят от программы и решения банка.</p>';
const body={
'01':'<div class="proposal layout-one"><div class="proposal-rate">'+rate+facts+'</div><div class="proposal-action">'+help+action+'</div></div>',
'02':'<div class="proposal layout-two"><div class="proposal-rate">'+rate+'</div><div class="proposal-facts">'+facts+'</div><div class="proposal-action">'+help+action+'</div></div>',
'03':'<div class="proposal layout-three"><div class="proposal-rate">'+rate+'</div><div class="proposal-action">'+facts+help+action+'</div></div>'};
const params=new URLSearchParams(location.search),selected=variants.find(v=>v.id===params.get('variant'));
if(selected){
 document.body.className=params.has('embed')?'embedded':'standalone';
 if(params.has('embed'))document.documentElement.style.overflow='hidden';
 document.title=selected.id+' · '+selected.name+' — Ипотека';
 document.body.innerHTML='<nav class="variant-nav" aria-label="Варианты блока"><a href="mortgage-options-right.html">← Все три варианта</a><span>'+selected.id+' / '+selected.name+'</span><button class="grid-toggle" type="button" aria-pressed="false">Показать вертикали</button></nav><main><section class="concept" aria-labelledby="concept-title"><h2 class="section-title" id="concept-title">Семейная ипотека</h2>'+body[selected.id]+'<div class="grid-guide" aria-hidden="true"></div></section><div class="context-next"><h2>Как проходит строительство</h2><p>Следующий раздел сайта</p></div></main>';
 document.querySelector('.grid-toggle').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));document.querySelector('.concept').classList.toggle('show-grid',on);e.currentTarget.textContent=on?'Скрыть вертикали':'Показать вертикали'});
}else{
 document.body.innerHTML='<header class="options-header"><a href="index.html#mortgage">← Вернуться на сайт</a><h1>Ипотека · кнопка справа</h1><p>Три композиции с кнопкой справа. Во всех вариантах её правый край совпадает с границей контейнера сайта. Откройте эскиз и включите «Показать вертикали», чтобы увидеть привязку к сетке.</p></header><main class="options-grid">'+variants.map(v=>'<article class="option-card"><a class="option-link" href="?variant='+v.id+'" aria-label="Открыть вариант '+v.id+': '+v.name+'"><div class="preview-frame"><iframe src="?variant='+v.id+'&embed=1" title="Эскиз '+v.id+'" tabindex="-1" aria-hidden="true"></iframe></div><div class="option-caption"><strong>'+v.id+' · '+v.name+'</strong><span aria-hidden="true">↗</span></div></a><p class="option-description">'+v.description+'</p></article>').join('')+'</main>';
 const observer=new ResizeObserver(entries=>entries.forEach(e=>{e.target.querySelector('iframe').style.transform='scale('+e.contentRect.width/1440+')'}));document.querySelectorAll('.preview-frame').forEach(el=>observer.observe(el));
}
</script>
</body></html>
