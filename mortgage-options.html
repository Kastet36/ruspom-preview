<style>

.options-header{max-width:1740px;margin:0 auto;padding:40px clamp(20px,4.4vw,80px) 30px}.options-header>a{font-size:13px;color:var(--muted)}.options-header h1{font-size:clamp(28px,3vw,44px);letter-spacing:-.04em;margin:26px 0 14px}.options-header p{max-width:740px;color:var(--muted);font-size:15px;line-height:1.7;margin:0}.options-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1900px;padding:0 28px 64px;margin:auto}.option-card{min-width:0}.option-link{display:block;border:1px solid #c4a56550;border-radius:5px;overflow:hidden}.option-link:hover{border-color:var(--gold)}.option-link:focus-visible{outline:2px solid var(--gold);outline-offset:5px}.preview-frame{position:relative;aspect-ratio:1440/650;overflow:hidden;pointer-events:none}.preview-frame iframe{position:absolute;left:0;top:0;width:1440px;height:650px;border:0;transform-origin:top left;pointer-events:none}.option-caption{padding:20px;border-top:1px solid #ffffff14;display:flex;justify-content:space-between;gap:15px;align-items:center}.option-caption strong{font-size:17px;line-height:1.4}.option-caption span{font-size:23px;color:var(--gold)}.option-description{margin:14px 2px 0;color:var(--muted);font-size:14px;line-height:1.7}.option-description b{font-weight:600;color:var(--cream)}
.concept{max-width:1740px;margin:auto;padding:52px clamp(25px,4.4vw,80px) 40px}.concept h2{margin-bottom:38px}.concept-rate{display:flex;align-items:baseline;gap:14px;white-space:nowrap;color:var(--gold);margin:0}.concept-rate strong{font-size:128px;font-weight:800;line-height:1;letter-spacing:-.07em}.concept-rate strong span{font-size:.72em}.concept-rate>span:first-child{font-size:26px}.concept-rate>span:last-child{font-size:14px;color:var(--muted)}.concept-facts{display:flex;gap:24px;flex-direction:column}.concept-facts p{font-size:17px;line-height:1.55;font-weight:600;margin:0;display:flex;align-items:flex-start;gap:13px}.concept-facts svg{width:24px;height:24px;flex:none;color:var(--gold);margin-top:2px}.concept-help{font-size:16px;line-height:1.7;color:var(--muted);margin:0}.concept-button{margin-top:24px;min-width:280px;min-height:58px;justify-content:space-between;font-size:14px;padding:18px 24px;box-shadow:none}.concept-note{font-size:11px;line-height:1.7;color:#8b978e;margin:14px 0 0;max-width:480px}.context-next{max-width:1740px;padding:28px clamp(25px,4.4vw,80px) 40px;margin:auto;border-top:1px solid #ffffff0c}.context-next h2{font-size:34px;font-weight:700;letter-spacing:-.04em;margin:0;color:#b4b7ae}.context-next p{font-size:12px;color:#7f8d82;margin:14px 0 0}.variant-nav{max-width:1740px;margin:auto;padding:20px clamp(20px,4.4vw,80px);font-size:13px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);border-bottom:1px solid #ffffff14}.variant-nav a:hover{color:var(--gold)}
.layout-one{max-width:980px}.one-main{display:flex;align-items:center;gap:76px}.one-footer{margin-top:30px}.one-footer .concept-help{max-width:580px}
.layout-two{max-width:1180px}.two-main{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:40px;align-items:center;border-top:1px solid #c4a56560;border-bottom:1px solid #c4a56560;padding:26px 0}.two-main .concept-facts{display:contents}.two-main .concept-facts p{font-size:16px;display:block;max-width:200px}.two-main .concept-facts svg{display:block;margin:0 0 12px}.two-main .concept-rate strong{font-size:108px}.two-footer{margin-top:24px}.two-footer .concept-help{max-width:600px}
.layout-three{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:64px;max-width:1280px;align-items:center}.three-copy .concept-facts{margin:28px 0 20px;gap:12px}.three-copy .concept-facts p{font-size:16px;font-weight:500}.three-copy .concept-facts br{display:none}.three-copy .concept-facts svg{width:20px;height:20px}.three-copy .concept-rate strong{font-size:112px}.three-photo{margin:0;align-self:stretch;min-height:320px;display:flex;align-items:center;overflow:hidden}.three-photo img{width:100%;height:auto;display:block;border-radius:4px}.standalone .concept{padding-top:44px}.embedded .variant-nav{display:none}.embedded .context-next{padding-top:24px}.embedded .concept{padding-top:48px;padding-bottom:36px}.embedded .concept h2{font-size:46px}.embedded .context-next h2{font-size:30px}
@media(max-width:1100px){.options-grid{grid-template-columns:1fr;max-width:940px;padding:0 20px 40px;gap:34px}.layout-three{gap:32px}.two-main{gap:24px}.three-copy .concept-rate strong{font-size:96px}.concept-facts p{font-size:16px}}
@media(max-width:780px){.concept{padding:32px 20px}.concept h2{margin-bottom:28px}.concept-rate strong{font-size:100px}.concept-rate{gap:11px}.concept-rate>span:first-child{font-size:22px}.concept-rate>span:last-child{font-size:12px}.one-main{align-items:flex-start;gap:26px;flex-direction:column}.concept-facts{gap:18px}.concept-facts p{font-size:15px}.one-footer{margin-top:24px}.concept-help{font-size:15px}.concept-button{width:100%;max-width:390px;min-width:0}.concept-note{font-size:10px}.two-main{grid-template-columns:1fr 1fr;gap:24px 20px;padding:24px 0}.two-main .concept-rate{grid-column:1/-1}.two-main .concept-facts p{font-size:14px}.two-main .concept-rate strong{font-size:100px}.layout-three{grid-template-columns:1fr;gap:26px}.three-photo{min-height:0;max-width:500px}.three-copy .concept-rate strong{font-size:100px}.three-copy .concept-facts p{font-size:15px}.context-next{padding:25px 20px}.context-next h2{font-size:28px}.variant-nav{font-size:12px}.option-caption strong{font-size:16px}.options-header{padding-top:28px}}

</head><body>
<script>
const variants=[{id:'01',name:'Ставка и преимущества',description:'<b>Компактная открытая композиция.</b> Ставка рядом с преимуществами. Ниже текст о помощи и кнопка. Вся группа собрана у левого края.'},{id:'02',name:'Горизонтальная полоса',description:'<b>Самый короткий блок.</b> Ставка и два преимущества в одной строке. Тонкие линии отделяют предложение от соседних разделов.'},{id:'03',name:'С фотографией дома',description:'<b>Предложение рядом с реальным домом.</b> Текст и кнопка собраны слева, фотография продолжает визуальный характер сайта.'}];
const rate='<p class="concept-rate" aria-label="От 6 процентов годовых"><span>от</span><strong>6<span>%</span></strong><span>годовых</span></p>';
const shield='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></svg>';
const bank='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m3 8 9-5 9 5v2H3V8ZM5 10v9m7-9v9m7-9v9M3 21h18"/></svg>';
const facts='<div class="concept-facts"><p>'+shield+'<span>Строительство через <br>эскроу-счёт</span></p><p>'+bank+'<span>Аккредитация <br>в 5 банках</span></p></div>';
const help='<p class="concept-help">Поможем подобрать программу и подготовить документы.</p>';
const action='<a class="cta concept-button" href="tel:+78124256667">Узнать условия <span class="arrow" aria-hidden="true">→</span></a><p class="concept-note">Условия и одобрение зависят от программы и решения банка.</p>';
const body={
'01':'<div class="layout-one"><div class="one-main">'+rate+facts+'</div><div class="one-footer">'+help+action+'</div></div>',
'02':'<div class="layout-two"><div class="two-main">'+rate+facts+'</div><div class="two-footer">'+help+action+'</div></div>',
'03':'<div class="layout-three"><div class="three-copy">'+rate+facts+help+action+'</div><figure class="three-photo"><img src="assets/cinema/living-summer.webp" width="1774" height="887" alt="Реальный дом компании, окружение обработано для презентации"></figure></div>'};
const params=new URLSearchParams(location.search),selected=variants.find(v=>v.id===params.get('variant'));
if(selected){
 document.body.className=params.has('embed')?'embedded':'standalone';
 if(params.has('embed'))document.documentElement.style.overflow='hidden';
 document.title=selected.id+' · '+selected.name+' — Ипотека';
 document.body.innerHTML='<nav class="variant-nav" aria-label="Варианты блока"><a href="mortgage-options.html">← Все три варианта</a><span>'+selected.id+' / '+selected.name+'</span></nav><main><section class="concept" aria-labelledby="concept-title"><h2 class="section-title" id="concept-title">Семейная ипотека</h2>'+body[selected.id]+'</section><div class="context-next"><h2>Как проходит строительство</h2><p>Следующий раздел сайта</p></div></main>';
}else{
 document.body.innerHTML='<header class="options-header"><a href="index.html#mortgage">← Вернуться на сайт</a><h1>Три варианта блока ипотеки</h1><p>Одинаковые тексты, ставка и кнопка. Разная композиция. Нажмите на вариант, чтобы посмотреть его в полном размере и на телефоне.</p></header><main class="options-grid">'+variants.map(v=>'<article class="option-card"><a class="option-link" href="?variant='+v.id+'" aria-label="Открыть вариант '+v.id+': '+v.name+'"><div class="preview-frame"><iframe src="?variant='+v.id+'&embed=1" title="Эскиз '+v.id+'" tabindex="-1" aria-hidden="true"></iframe></div><div class="option-caption"><strong>'+v.id+' · '+v.name+'</strong><span aria-hidden="true">↗</span></div></a><p class="option-description">'+v.description+'</p></article>').join('')+'</main>';
 const observer=new ResizeObserver(entries=>entries.forEach(e=>{e.target.querySelector('iframe').style.transform='scale('+e.contentRect.width/1440+')'}));document.querySelectorAll('.preview-frame').forEach(el=>observer.observe(el));
}
</script>
</body></html>
